[project]
name = "clamp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # CLAMP compound encoder via scikit-fingerprints.
    # CLAMPFingerprint is unreleased (not in PyPI 2.0.0); pin the master commit that adds it.
    "scikit-fingerprints[neural] @ git+https://github.com/scikit-fingerprints/scikit-fingerprints.git@e49a9fafaab031a3681b69958978691e73ac5ffc",
    # required by model_wrappers/run.py inside this venv
    "numpy",
    "pandas",
    "pyarrow",
    "click",
    "tqdm",
]
