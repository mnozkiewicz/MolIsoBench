[project]
name = "graphfp"
version = "0.1.0"
requires-python = ">=3.10, <3.11"
dependencies = [
    "torch==1.13.1",
    "rdkit",
    "networkx==2.8.8",
    "ogb==1.3.5",
    "info-nce-pytorch==0.1.4",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "click",
    "tqdm",
    "numpy<2.0",
    "torch-geometric==2.0.4",
    "torch-scatter==2.1.0",
    "torch-sparse==0.6.16",
    "torch-cluster==1.6.0",
]

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-1.13.1+cpu.html"]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-sparse = ["torch"]
torch-cluster = ["torch"]
