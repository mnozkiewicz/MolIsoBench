[project]
name = "molbert-env"
version = "0.1.0"
requires-python = ">=3.8, <3.9"
dependencies = [
    "torch==1.4.0",
    "pytorch-lightning==0.8.4",
    "transformers==3.5.1",
    "scikit-learn",
    "scipy",
    "pandas",
    "pyarrow",
    "click",
    "tqdm",
    "numpy<1.24",
    "rdkit",
    "protobuf<3.21",
    "molbert",
    "networkx",
]

[tool.uv.sources]
molbert = { path = "./molbert_repo", editable = true }


[tool.uv]
override-dependencies = [
    "scikit-learn>=0.23.2",
    "scipy>=1.5.0"
]